name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - feature/cicd

jobs:
  build_and_test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ❗ Build + push in ONE step (better)
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chatstack-app:${{ github.sha }}

  deploy:
    needs: build_and_test
    runs-on: ubuntu-22.04

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/chatstack-app:${{ github.sha }}

            docker stop chatstack-app || true
            docker rm chatstack-app || true

            docker run -d -p 8386:8386 --name chatstack-app \
              ${{ secrets.DOCKERHUB_USERNAME }}/chatstack-app:${{ github.sha }}